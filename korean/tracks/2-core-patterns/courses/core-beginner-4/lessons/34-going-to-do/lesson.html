<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <meta name="podo:lesson-id" content="34-going-to-do">
  <meta name="podo:level" content="초급">
  <meta name="podo:content-version" content="2026-08-10">
  <meta name="podo:title-ko" content="밥 먹으러 가요 · 하러 가자고 하기">
  <meta name="podo:title-en" content="Let's go eat — going in order to do">
  <meta name="podo:title-ja" content="ごはんを食べに行きます · 〜しに行こうと言う">
  <title>밥 먹으러 가요 · 하러 가자고 하기 — PODO 韓国語</title>
  <link rel="stylesheet" href="../../../../../../runtime/css/lesson-card.css">
  <link rel="stylesheet" href="../../../../../../runtime/css/trial.css">
</head>
<body>
  <div class="phone">

    <!-- ============================================================
         PAGES GO HERE — one .phone child per page, one activity per page.

         Plan the arc from  lesson-blueprint.md
         Take the content from  toc/lesson-034.md
         Copy component markup and tutor voice from the deck this
         skeleton came from — do not invent components.

         The first page must carry data-act, since the cover that used
         to supply it is a trial-only page and is not here.
         ============================================================ -->
  </div>



  <!-- ACTIVITIES · 점선 칸 · 고르기 · 문장 만들기. 공유 스크립트.
       페이저보다 먼저 와야 한다 — 티칭 모드가 여기 만든 유령 답을 쓴다. -->
  <script src="../../../../../../runtime/js/activities.js"></script>


  <!-- ================================================================
       PAGER · 한 장씩 넘겨 보는 모드
       The deck is a flat list of siblings under .phone, so paging is
       just "show one, hide the rest" — no restructuring.
       ================================================================ -->
  <nav class="pager" data-sync-id="deck-page" data-sync-kind="page">
    <input class="pg-scrub" type="range" min="0" max="0" step="1" value="0" aria-label="페이지 이동">
    <button class="pg-btn pg-prev" type="button" aria-label="이전 페이지">←</button>
    <div class="pg-mid">
      <span class="pg-label"><b class="pg-act">—</b><span class="pg-n">—</span></span>
    </div>
    <button class="pg-btn pg-teach" type="button" aria-label="티칭 모드">T</button>
    <button class="pg-btn pg-next" type="button" aria-label="다음 페이지">→</button>
  </nav>

  <!-- PAGER · 한 장씩 넘기기 + 스크러버. 공유 스크립트. -->
  <script src="../../../../../../runtime/js/pager.js"></script>

  <!-- SCRIPT LINES · 대사를 문장 단위로 짝지어 세운다. 형광펜보다 먼저 —
       형광펜은 로드 때 글 블록에 번호를 매기므로 DOM 이 먼저 확정돼야 한다. -->
  <script src="../../../../../../runtime/js/script-lines.js"></script>

  <!-- SPOTLIGHT · 손가락 포인터 (그리기 대신 "여기 보세요"). 공유 스크립트. -->
  <script src="../../../../../../runtime/js/spotlight.js"></script>

  <!-- TUTOR NOTES · 페이지마다 메모 한 칸. 비어 있으면 아무에게도 안 보이고,
       튜터가 쓰는 순간 양쪽에 뜬다. 보드 기본 kind("value")를 그대로 쓰므로
       등록할 것이 없다 — 전송도 IME 도 보드가 한다. 페이저 뒤에 두는 것이
       중요하다: 페이지를 다 세고 난 뒤에 칸을 끼워 넣어야 한다. -->
  <script src="../../../../../../runtime/js/tutor-notes.js"></script>

  <!-- HIGHLIGHT · 글자에 긋는 형광펜. 그은 자국이 상대 화면에도 남는다.
       ja→ko 툴팁 뒤에 와야 한다 — 그쪽이 로드 때 텍스트 노드를 읽어 data-ko 를
       붙이고, 형광펜은 그 뒤로 <mark> 을 끼워 넣기 때문이다. -->
  <script src="../../../../../../runtime/js/highlight.js"></script>

  <!-- STAMP · 참! 잘했어요. stamp.js 가 이 그림을 페이지마다, 그리고 페이저
       버튼 안에 복제한다. 경로를 쓰는 곳이 여기 하나뿐인 게 중요하다:
       패키저는 마크업에 적힌 이미지 경로만 번들·평탄화하므로, JS 로 경로를
       만들면 로컬에서만 되고 보드(S3)에서 404 가 난다. .phone 밖에 두는 것도
       중요하다 — 페이저는 .phone 의 자식을 페이지로 세기 때문에, 안에 넣으면
       빈 페이지가 하나 생긴다. (이 주석에 경로 표기를 그대로 쓰면 패키저가
       주석까지 훑어 없는 파일을 찾으므로, 말로만 적는다.) -->
  <img class="stamp-art" src="../../../../../../trial/assets/well-done.svg" alt="">
  <script src="../../../../../../runtime/js/stamp.js"></script>

  <!-- よみがな · 페이지 오른쪽 위의 발음 표기 스위치. 공유 스크립트.
       상태는 body.no-yomi 하나뿐이고, 양쪽 화면이 같이 움직인다. -->
  <script src="../../../../../../runtime/js/yomi.js"></script>

</body>
</html>

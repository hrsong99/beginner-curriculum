  :root {

  .links { display: flex; flex-wrap: wrap; gap: 7px; margin: 22px 0 0; }

  .links a:hover { border-color: var(--ink); color: var(--ink); }
  .links a.primary { background: var(--ac); border-color: var(--ac); color: #fff; }
  .links a.primary:hover { filter: brightness(.92); }

  /* ---------- 2단 · 띠 제목 ---------- */
  .band { display: flex; align-items: baseline; flex-wrap: wrap; gap: 12px;

  .controls { position: sticky; top: 47px; z-index: 20; padding: 12px 0 11px;

  .controls.stuck { box-shadow: 0 10px 20px -18px rgba(0,0,0,.5); }
  .crow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .crow + .crow { margin-top: 9px; }
  .search { flex: 1 1 240px; min-width: 190px; padding: 9px 15px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font: inherit; font-size: 13.5px; }

  /* 이 페이지에서 실제로 누르는 것은 이 둘뿐이라 버튼처럼 보이게 둔다 */
  .btn { padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff;
    color: var(--ink-2); font: inherit; font-size: 12.5px; font-weight: 650; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--ink); color: var(--ink); }
  .btn.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn.deep { border-color: var(--ac); color: var(--ac); }
  .btn.deep:hover { background: var(--tint); }
  .btn.deep.on { background: var(--ac); border-color: var(--ac); color: #fff; }
  .hits { margin-left: auto; color: var(--ink-3); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---------- 3단 · 단원 카드 ---------- */
  .groups { margin-top: 16px; display: grid; gap: 10px; }
  .group { border: 1px solid var(--line); border-radius: 13px; overflow: hidden; transition: border-color .16s, box-shadow .16s; }
  .group:hover { border-color: var(--ac); }
  .group.open { border-color: var(--ac); box-shadow: 0 10px 26px -22px rgba(0,0,0,.5); }

  .gnum { display: grid; place-items: center; min-width: 40px; height: 34px; padding: 0 9px; border-radius: 9px;

  .group.open .gnum { background: var(--ac); color: #fff; }
  .gtitle { min-width: 0; font-size: 18px; font-weight: 750; letter-spacing: -.03em; word-break: keep-all; }
  .gtitle em { display: block; margin-top: 2px; color: var(--ink-3); font-style: normal; font-size: 12.5px; font-weight: 500; letter-spacing: 0; }

  .lv-tag { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }

  .caret::before { content: "\25B8"; }
  .group.open .caret { color: var(--ac); }
  .group.open .caret::before { content: "\25BE"; }
  .gbody { display: none; padding: 16px 20px 10px; }
  .group.open .gbody { display: block; }

  .story { margin: 0; max-width: 70ch; color: var(--ink-2); font-size: 13.5px; line-height: 1.75; word-break: keep-all; }

  .story .cast { display: block; margin-top: 5px; color: var(--ink-4); font-size: 12px; }

  .lessons { margin-top: 16px; border-top: 1px solid var(--line-soft); }

  .gbody > .lessons:first-child { margin-top: 0; border-top: 0; }
  .lesson { border-bottom: 1px solid var(--line-soft); }
  .lesson.hide { display: none; }
  .lrow { display: flex; align-items: center; gap: 10px; }
  .lrow-btn { flex: 1 1 auto; min-width: 0;

  /* 덱이 나와 있는 과에만 붙는 문. 여기는 4단이라 트랙색을 쓰지 않는다 —

  .deck { flex: 0 0 auto; padding: 5px 11px; border: 1px solid var(--line); border-radius: 8px; background: #fff;
    color: var(--ink-2); font-size: 11.5px; font-weight: 700; white-space: nowrap; }
  .deck:hover { border-color: var(--ink); color: var(--ink); }
  .deck .ext { color: var(--ink-4); font-size: 10px; }
  .deck:hover .ext { color: var(--ink-3); }
  .lrow-btn:hover .ltitle { color: var(--ac); }
  .lno { color: var(--ink-4); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }

  .ltitle em { font-style: normal; color: var(--ink-3); font-weight: 450; letter-spacing: 0; }

  @media (max-width: 760px) { .lchips { display: none; } .lrow-btn { grid-template-columns: 46px minmax(0,1fr) 14px; } }

  .lcaret::before { content: "\25B8"; }
  .lrow-btn:hover .lcaret { color: var(--ink-3); }
  .lesson.open .lcaret { color: var(--ac); }
  .lesson.open .lcaret::before { content: "\25BE"; }

  /* ---------- 5단 · 펼친 과 ----------
     예문이 21px 인데 그 과의 제목은 14.5px 이라, 열어 놓으면 예문이 제 제목을
     눌러 버렸다. 펼친 과는 이제 카드 한 장이고 — 제목이 그 카드의 머리, 나머지는
     카드 안의 내용 — 순서가 제목 → 할 수 있는 것 → 예문 → 표현으로 고정된다.
     예문은 흰 자리에 앉혀 제목보다 낮은 단이라는 것을 눈에 보이게 했다. */
  /* 펼친 과는 통째로 한 블록이다 — 머리(번호 + 제목)와 본문이 한 테두리 안에 있다.
     행 옆에 번호만 남고 내용이 옆의 다른 상자로 빠지면 둘이 남처럼 보인다. */
  .lesson.open { margin: 12px 0; background: var(--surface);

  .lesson.open .lrow { padding-right: 20px; }
  .lesson.open .lrow-btn { grid-template-columns: auto minmax(0,1fr) 14px; gap: 12px; padding: 15px 20px 13px; }
  .lesson.open .lno { color: var(--ac); font-weight: 700; }
  .lesson.open .ltitle { font-size: 17px; font-weight: 800; letter-spacing: -.025em; }
  .lesson.open .ltitle em { font-size: 14px; }
  .lesson.open .lchips { display: none; }       /* 블록 안에서 패턴 이름이 다시 나온다 */

  .ldetail { display: none; padding: 0 20px 18px; }
  .lesson.open .ldetail { display: block; }
  @media (max-width: 760px) { .ldetail { padding: 0 16px 16px; } }

  /* 블록 안의 칸. 세 칸이 같은 생김새라 라벨만 보면 무엇인지 알 수 있다. */
  .field + .field { margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--line); }
  .field > .lbl { display: block; margin-bottom: 8px; }

  /* 이 과의 약속. 카드에서 제일 먼저 읽혀야 하는 줄이라 본문보다 크고 진하다. */
  .goal { margin: 0; max-width: 62ch; color: var(--ink); font-size: 15px; font-weight: 600; line-height: 1.65; word-break: keep-all; }

  .words span { padding: 5px 12px; background: #fff; border: 1px solid var(--line); border-radius: 8px; font-size: 16px; font-weight: 700; }
  .scene { margin: 0 0 14px; max-width: 62ch; color: var(--ink-3); font-size: 13px; line-height: 1.6; word-break: keep-all; }

  /* 페이지에서 채운 색은 트랙색과 이 살구색뿐이고, 트랙색은 3단 위쪽에만 있다.
     그래서 과를 펼쳤을 때 그 안에서 유일하게 칠해진 것이 배우는 조각이 된다. */
  .pats { display: grid; gap: 8px; }
  .pcard { padding: 13px 16px; background: #fff; border: 1px solid var(--line); border-radius: 10px; }
  .pcard .sent { margin: 0; font-size: 18.5px; font-weight: 700; line-height: 1.45; letter-spacing: -.025em; word-break: keep-all; }
  .pcard .sent mark { background: var(--pat-mark); color: var(--pat-ink); padding: 1px 3px; margin: 0 -1px; border-radius: 4px; font-weight: 800;
    -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .pcard .reply { margin: 5px 0 0; color: var(--ink-3); font-size: 13px; font-weight: 500; word-break: keep-all; }
  .pcard .reply::before { content: "\21B3 "; color: var(--ink-4); }
  .pcard .pmeta { margin: 8px 0 0; padding-top: 7px; border-top: 1px solid var(--line-soft);
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 9px; }
  .pcard .pname { color: var(--pat-ink); font-size: 12px; font-weight: 750; }
  .pcard .pgloss { color: var(--ink-4); font-size: 11.5px; word-break: keep-all; }

  /* 표현 — 훑을 때 눈에 걸리도록 글줄이 아니라 낱개로 앉힌다 */
  .said { display: flex; flex-wrap: wrap; gap: 6px; }
  .said span { padding: 4px 11px; background: #fff; border: 1px solid var(--line); border-radius: 7px;
    color: var(--ink-2); font-size: 12.5px; font-weight: 600; }
  .rule { margin: 11px 0 0; max-width: 66ch; color: var(--ink-2); font-size: 12.5px; line-height: 1.7; word-break: keep-all; }


  .empty { margin-top: 40px; color: var(--ink-3); font-size: 13.5px; text-align: center; }
  .empty.hide { display: none; }
  .nextrack { display: flex; justify-content: space-between; gap: 14px; margin-top: 70px; padding-top: 22px; border-top: 1px solid var(--line); }
  .nextrack a { color: var(--ink-3); font-size: 13px; font-weight: 600; }
  .nextrack a:hover { color: var(--ink); }
  footer { margin-top: 26px; color: var(--ink-4); font-size: 12px; line-height: 1.8; }
  footer code { color: var(--ink-3); font-size: 11.5px; }

<nav class="tabs"><div class="tabs-in" id="tabs"></div></nav>
<div class="wrap">

  <header class="hero">
    <span class="hero-no" id="hno"></span>
    <h1 id="h1"></h1>
    <p class="hero-d" id="hd"></p>

      <div id="distwrap"></div>
    </div>
    <div class="links" id="links"></div>
  </header>

  <div class="band" id="band"></div>

  <div class="controls">
    <div class="crow">
      <input class="search" id="q" type="search" placeholder="과·패턴·표현 검색" autocomplete="off">
      <button class="btn" id="expandUnits" type="button">단원 모두 펼치기</button>
      <button class="btn deep" id="expandAll" type="button">과까지 모두 펼치기</button>

    <div class="crow" id="levelbar"></div>

  <div class="groups" id="groups"></div>
  <div class="empty hide" id="empty">검색 결과가 없습니다.</div>

  <div class="nextrack" id="nextrack"></div>

function chips(l) {
  const p = (l.chips || []).slice(0, 2).map(c =>
    `<span class="pat" title="${esc(c)}">${esc(c.replace(/\s+\(.*$/, "").trim() || c)}</span>`);
  if (l.refs && l.refs.length) p.push(`<span class="pat ref">핵심 ${l.refs[0]}</span>`);
  return p.join(`<span class="sep">·</span>`);
}

/** 문장을 그대로 쓰되, 배우는 조각에만 mark 를 씌운다. spans 는 빌드 때 계산된다. */
function marked(sentence, spans) {
  if (!spans || !spans.length) return esc(sentence);
  let out = "", last = 0;
  for (const [a, b] of spans) {
    out += esc(sentence.slice(last, a)) + "<mark>" + esc(sentence.slice(a, b)) + "</mark>";
    last = b;
  }
  return out + esc(sentence.slice(last));
}

/** 펼친 과는 라벨 붙은 칸 셋으로 이루어진다 — 무엇을 할 수 있게 되는가,
    무엇을 배우는가, 그리고 그것을 받쳐 주는 말. 트랙마다 칸의 이름만 달라진다. */
function detail(l) {
  const fields = [];

  // ① 이 과의 약속
  if (l.can) {
    const words = l.can.split(" · ").map(w => w.trim()).filter(Boolean);
    const listy = words.length >= 3 && words.every(w => w.length <= 7);
    fields.push([l.canLabel || "할 수 있는 것", listy
      ? `<div class="words">${words.map(w => `<span>${esc(w)}</span>`).join("")}</div>`
      : `<p class="goal">${esc(l.can)}</p>`]);
  }

  // ② 배우는 것 — 패턴이 있으면 예문 안에서 짚어 주고, 없으면 이름만 늘어놓는다
  const ps = (l.pats || []).filter(p => p.ex || p.pat);
  if (ps.length) {
    fields.push([`배우는 패턴 ${ps.length}`, `<div class="pats">` + ps.map(p => `<div class="pcard">
      ${p.ex ? `<p class="sent">${marked(p.ex, p.spans)}</p>` : ""}
      ${p.reply ? `<p class="reply">${esc(p.reply)}</p>` : ""}
      <div class="pmeta"><span class="pname">${esc(p.pat)}</span>
        ${p.gloss ? `<span class="pgloss">${esc(p.gloss)}</span>` : ""}</div></div>`).join("") + `</div>`]);
  } else if (l.fix) {
    fields.push(["고치는 법", `<p class="goal">${esc(l.fix)}</p>`]);
  }
  if (l.chips && l.chips.length && !ps.length) {
    fields.push([l.fix ? "최소 대립쌍" : "배우는 것",
      `<div class="said">${l.chips.map(c => `<span>${esc(c)}</span>`).join("")}</div>`]);
  }

  // ③ 받쳐 주는 말 — 통째로 외워 쓰는 표현과, 딱 한 줄짜리 규칙
  const said = (l.notes || []).find(n => n.k === "표현");
  const rule = (l.notes || []).find(n => n.k === "문법");
  if (said || rule) {
    // 트랙마다 구분자가 다르다: 핵심은 ·, 상황별은 쉼표. 쉼표로도 나누되 · 로 갈린
    // 뒤에는 건드리지 않는다 — "아, 그래요?" 처럼 쉼표를 품은 한 덩어리가 있다.
    let ws = [];
    if (said) {
      ws = said.v.split(/\s*·\s*/).filter(Boolean);
      if (ws.length === 1) ws = ws[0].split(/\s*,\s*/).filter(Boolean);
    }
    fields.push([said && rule ? "표현과 규칙" : said ? "표현" : "규칙",
      (ws.length ? `<div class="said">${ws.map(w => `<span>${esc(w)}</span>`).join("")}</div>` : "")
      + (rule ? `<p class="rule">${esc(rule.v)}</p>` : "")]);
  }

  if (!fields.length) return `<p class="scene">이 과의 상세는 목차 원문에 있습니다.</p>`;
  return (l.scene ? `<p class="scene">${esc(l.scene)}</p>` : "")
    + fields.map(([lbl, body]) => `<div class="field"><span class="lbl">${esc(lbl)}</span>${body}</div>`).join("");
}

function lessonRow(l) {
  const c = chips(l);
  const sub = l.sub || (c ? "" : l.can);
  const no = String(l.n).padStart(2, "0");
  // 덱이 있으면 그 과에서 곧장 수업 화면으로 나간다 — 카탈로그를 잃지 않도록 새 탭에서.
  const deck = l.deck
    ? `<a class="deck" href="../${esc(l.deck)}" target="_blank" rel="noopener"
         title="${esc(l.title)} 덱을 새 탭에서 엽니다">덱 열기 <span class="ext">↗</span></a>`
    : "";
  return `<div class="lesson" data-text="${esc([l.title, l.sub, l.can, l.scene, (l.chips||[]).join(" "), (l.notes||[]).map(n=>n.v).join(" ")].join(" ").toLowerCase())}">
    <div class="lrow">
      <button class="lrow-btn" type="button">
        <span class="lno">${esc(T.lessonWord)} ${no}</span>
        <span class="ltitle">${esc(l.title)}${sub ? ` <em>— ${esc(sub)}</em>` : ""}</span>
        <span class="lchips">${c}</span>
        <span class="lcaret"></span>
      </button>
      ${deck}
    </div>
    <div class="ldetail">${detail(l)}</div>
  </div>`;
}

function group(g) {
  // 단원 머리에는 "이 단원이 무엇인가"만 둔다.
  //   · 패턴 목록은 바로 아래 과 목록이 이미 한 줄씩 들고 있다 — 같은 것을 두 번 적는 셈이었다
  //   · 단원 설명문은 이 커리큘럼을 왜 이렇게 짰는지에 대한 메모라, 훑어보는 자리에 놓일 글이 아니다
  // 둘 다 지우면 남는 것은 이야기와 성과, 그리고 과 목록뿐이다.
  let head = "";
  if (g.work) {
    head += `<p class="story"><b>《${esc(g.work)}》</b> ${esc(g.story)}
      ${g.cast ? `<span class="cast">등장인물 — ${esc(g.cast)}</span>` : ""}</p>`;
  }
  if (g.blurb && (g.work || T.id === "3-contextual-korean")) {
    head += `<p class="gcan"><b class="lbl">끝내면 할 수 있는 것</b>${esc(g.blurb)}</p>`;
  }

  return `<div class="group" data-lv="${esc(g.level || "")}">
    <button class="ghead" type="button">
      <span class="gnum">${esc(g.label)}</span>
      <span class="gtitle">${esc(g.title)}${g.subtitle ? `<em>${esc(g.subtitle)}</em>` : ""}</span>
      <span class="gmeta">${g.peak ? `<span>핵심 ${g.peak}과까지</span>` : ""}${g.form ? `<span>${esc(g.form)}</span>` : ""}
        ${g.level ? `<span class="lv-tag"><i style="background:${lvColor(g.level)}"></i>${esc(g.levelText || g.level)}</span>` : ""}
        <span>${g.lessons.length}${esc(T.lessonWord)}</span><span class="caret"></span></span>
    </button>
    <div class="gbody">
      ${head}
      <div class="lessons">${g.lessons.map(lessonRow).join("")}</div>
    </div>
  </div>`;
}

const $groups = document.getElementById("groups");
$groups.innerHTML = T.groups.map(group).join("");

/* ---------- 이전 · 다음 트랙 ---------- */
{
  const i = DATA.nav.findIndex(n => n.id === T.id);
  const prev = DATA.nav[i - 1], next = DATA.nav[i + 1];
  document.getElementById("nextrack").innerHTML =
    (prev ? `<a href="${esc(prev.id)}.html">← ${esc(prev.ko)}</a>` : `<a href="../catalog.html">← 카탈로그</a>`) +
    (next ? `<a href="${esc(next.id)}.html">${esc(next.ko)} →</a>` : `<a href="../catalog.html">카탈로그 →</a>`);
}

/* ---------- behaviour ---------- */
const $controls = document.querySelector(".controls");
const controlsTop = $controls.getBoundingClientRect().top + scrollY;
addEventListener("scroll", () => $controls.classList.toggle("stuck", scrollY > controlsTop - 47), { passive: true });

$groups.addEventListener("click", e => {
  if (e.target.closest(".deck")) return;          // 덱 링크는 펼치기가 아니라 나가기다
  const head = e.target.closest(".ghead");
  if (head) { head.parentElement.classList.toggle("open"); return; }
  const row = e.target.closest(".lrow-btn");
  if (row) { row.closest(".lesson").classList.toggle("open"); }
});

const $q = document.getElementById("q");
const $hits = document.getElementById("hits");
const $empty = document.getElementById("empty");
let activeLevels = new Set();

function apply() {
  const q = $q.value.trim().toLowerCase();
  let hits = 0, shown = 0;
  document.querySelectorAll(".group").forEach(g => {
    const lvOk = !activeLevels.size || activeLevels.has(g.dataset.lv);
    let inGroup = 0;
    g.querySelectorAll(".lesson").forEach(l => {
      const ok = lvOk && (!q || l.dataset.text.includes(q));
      l.classList.toggle("hide", !ok);
      if (ok) inGroup++;
    });
    g.classList.toggle("hide", inGroup === 0);
    if (inGroup) shown++;
    hits += inGroup;
    if (q) g.classList.add("open");
  });
  const filtering = q || activeLevels.size;
  $hits.textContent = filtering ? `${hits}${T.lessonWord} · ${shown}${T.unitWord}` : "";
  $empty.classList.toggle("hide", !(filtering && hits === 0));

  if (q) {
    document.querySelectorAll(".lesson:not(.hide) .ltitle").forEach(el => {
      const t = el.textContent, i = t.toLowerCase().indexOf(q);
      if (i < 0) return;
      el.innerHTML = esc(t.slice(0, i)) + "<mark>" + esc(t.slice(i, i + q.length)) + "</mark>" + esc(t.slice(i + q.length));
    });
  }
}

$q.addEventListener("input", () => {
  document.querySelectorAll(".ltitle mark").forEach(m => { const p = m.parentElement; p.innerHTML = p.textContent; });
  apply();
});

document.getElementById("levelbar").addEventListener("click", e => {
  const b = e.target.closest(".lv");
  if (!b) return;
  const lv = b.dataset.lv;
  activeLevels.has(lv) ? activeLevels.delete(lv) : activeLevels.add(lv);
  b.setAttribute("aria-pressed", activeLevels.has(lv));
  apply();
});

const $units = document.getElementById("expandUnits");
const $all = document.getElementById("expandAll");

function setOpen(units, lessons) {
  document.querySelectorAll(".group").forEach(g => g.classList.toggle("open", units));
  document.querySelectorAll(".lesson").forEach(l => l.classList.toggle("open", lessons));
  $units.classList.toggle("on", units && !lessons);
  $all.classList.toggle("on", lessons);
  $units.textContent = units && !lessons ? "단원 모두 접기" : "단원 모두 펼치기";
  $all.textContent = lessons ? "과까지 모두 접기" : "과까지 모두 펼치기";
}
$units.addEventListener("click", () => setOpen(!$units.classList.contains("on"), false));
$all.addEventListener("click", () => { const on = !$all.classList.contains("on"); setOpen(on, on); });

// 들어오자마자 첫 단원은 열어 둔다 — 이 페이지는 이미 한 트랙으로 좁혀진 자리라,
// 무엇이 들어 있는지 한 번은 보여 주는 편이 낫다.
document.querySelector(".group")?.classList.add("open");
</script>

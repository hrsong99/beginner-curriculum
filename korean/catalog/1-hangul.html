"ㅐ ㅔ ㅒ ㅖ (え 계열을 한 번에 — 일본어 귀에는 어차피 한 소리입니다)"]},{"n":8,"title":"합쳐진 모음 (w 모음)","sub":"","can":"사과 · 가위 · 의자 · 회사 · 뭐 · 왜","canLabel":"읽을 수 있다","level":"왕초급","chips":["ㅘ ㅝ ㅚ ㅟ ㅙ ㅞ ㅢ (아는 모음으로 만듭니다: ㅗ/ㅜ ＋ 모음 = w 활음)"]},{"n":9,"title":"복습 — 모든 글자, 받침만 빼고","sub":"새 글자 없음","can":"어제 · 화요일 · 교과서 · 뉴스 — 받침 없는 단어라면 처음 봐도 읽는다","canLabel":"읽을 수 있다","level":"왕초급","chips":["자음 19개 × 모음 21개","속도 읽기","부품에서 글자 조립하기"]}]},{"label":"3부","title":"받침","level":"왕초급","blurb":"","lessons":[{"n":10,"title":"받침 ① 울리는 소리","sub":"","can":"강 · 산 · 밤 · 문 · 발 · 길 · 엄마 · 사람 · 사랑 · 서울","canLabel":"읽을 수 있다","level":"왕초급","chips":["받침 ㅇ ㄴ ㅁ ㄹ (ㄴ/ㅁ/ㅇ은 ん에 걸고, ㅇ이 드디어 소리를 냅니다: ng. ㄹ은 가나에 걸 곳이 없는 하나 — 계속 울립니다)"]},{"n":11,"title":"받침 ② 막는 소리","sub":"","can":"책 · 밥 · 옷 · 부엌 · 낮 · 앞 · 한국 · 김밥","canLabel":"읽을 수 있다","level":"왕초급","chips":["ㄱ ㄷ ㅂ (っ에 겁니다 — 소리를 터뜨리지 않고 끊습니다)","받침 7개 소리 규칙 (ㅋㄲ→ㄱ","ㅅㅆㅈㅊㅌㅎ→ㄷ","ㅍ→ㅂ)"]},{"n":12,"title":"겹받침 — 글자 둘, 자리 하나","sub":"","can":"닭 · 삶 · 싫다 · 값 · 몫 · 많다","canLabel":"읽을 수 있다","level":"왕초급","chips":["ㄺ ㄻ ㅀ","ㅄ ㄳ ㄶ (둘 중 하나만 소리 납니다 — 어느 쪽인지가 규칙)"]},{"n":13,"title":"한국 사람처럼 읽기","sub":"","can":"한국어→한구거 · 음악→으막 · 좋아요→조아요 · 값이→갑씨 · 한국말→한궁말 · 십만→심만","canLabel":"읽을 수 있다","level":"왕초급","chips":["연음 (받침이 뒤의 빈 ㅇ으로 넘어갑니다 — 겹받침에서도)","ㅎ 약화","비음화"]},{"n":14,"title":"마무리 — 무엇이든 읽는다","sub":"새 글자 없음","can":"한국 거리의 간판 아무거나 — 뜯어서 소리 내어 읽는다","canLabel":"읽을 수 있다","level":"왕초급","chips":["전부 섞어서","실제 간판·메뉴·이름","첫 수업부터 듣게 될 인사와 교실 표현 (안녕하세요","감사합니다","잘 들으세요","따라 읽으세요)"]}]}],"dist":{"왕초급":14},"span":["왕초급"],"total":14},"nav":[{"id":"1-hangul","no":1,"ko":"한글 읽기","accent":"#4f7d10","total":14,"lessonWord":"레슨"},{"id":"2-core-patterns","no":2,"ko":"핵심 문법 패턴","accent":"#2b5fd9","total":116,"lessonWord":"과"},{"id":"3-contextual-korean","no":3,"ko":"상황별 한국어","accent":"#c22a5f","total":140,"lessonWord":"레슨"},{"id":"4-freetalking","no":4,"ko":"고급 프리토킹","accent":"#0080a8","total":91,"lessonWord":"주제"},{"id":"5-pronunciation","no":5,"ko":"발음 교정","accent":"#69737d","total":10,"lessonWord":"레슨"}]};
const T = DATA.track, LEVELS = DATA.levels;
const DARK = new Set(["중고급", "고급"]);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lvColor = lv => `var(--lv-${lv})`;

document.documentElement.style.setProperty("--ac", T.accent);
document.documentElement.style.setProperty("--tint", T.tint);
document.getElementById("ttl").textContent = `${T.ko} · PODO 한국어 커리큘럼`;

/* ---------- 탭 ---------- */
document.getElementById("tabs").innerHTML =
  `<a class="tab home" href="../catalog.html">← 카탈로그</a>` +
  DATA.nav.map(n => `<a class="tab${n.id === T.id ? " on" : ""}" href="${esc(n.id)}.html"
    style="--ac:${n.accent}"><em>${String(n.no).padStart(2, "0")}</em>${esc(n.ko)}</a>`).join("");

/* ---------- 1단 ---------- */
{
  const span = T.span.length ? (T.span.length === 1 ? T.span[0] : `${T.span[0]} — ${T.span[T.span.length - 1]}`) : "전 레벨";
  const flag = T.status === "plan" ? " · 계획 단계" : T.status === "open" ? " · 계속 추가" : "";
  document.getElementById("hno").textContent = `트랙 ${String(T.no).padStart(2, "0")} · ${span}${flag}`;
  document.getElementById("h1").innerHTML = `${esc(T.ko)}<span>${esc(T.en)}</span>`;
  document.getElementById("hd").textContent = T.desc;
  document.getElementById("hn").textContent = T.note;
  document.getElementById("figs").innerHTML =
    T.stats.map(s => `<div><b>${esc(s.v)}</b><span>${esc(s.k)}</span></div>`).join("");

  const used = LEVELS.filter(lv => T.dist[lv]);
  document.getElementById("distwrap").innerHTML = used.length
    ? `<div class="dist">${used.map(lv => `<i style="flex:${T.dist[lv]};background:${lvColor(lv)}"
        title="${lv} ${T.dist[lv]}${esc(T.lessonWord)}"></i>`).join("")}</div>
       <div class="dist-legend">${used.map(lv => `<span><i style="background:${lvColor(lv)}"></i>${lv} <b>${T.dist[lv]}</b></span>`).join("")}</div>`
    : `<div class="dist-legend"><span>특정 레벨에 묶이지 않습니다 — 튜터가 문제를 들은 시점에 한 과씩 꺼내 씁니다.</span></div>`;

  document.getElementById("links").innerHTML = T.links.map(l =>
    `<a class="${l.kind === "ghost" ? "" : "primary"}" href="../${esc(l.href)}">${esc(l.t)}</a>`).join("");
  document.getElementById("src").textContent = `korean/tracks/${T.id}/table-of-contents.md`;
}

document.getElementById("band").innerHTML =
  `<h2>${T.groups.length}개 ${esc(T.unitWord)} · ${T.total}${esc(T.lessonWord)}</h2>
   <p>${esc(T.unitWord)}를 눌러 펼치고, 과를 눌러 그 과가 가르치는 것을 봅니다.</p>`;

document.getElementById("levelbar").innerHTML =
  `<span class="lbl" style="margin-right:4px">레벨</span>` +
  LEVELS.filter(lv => T.dist[lv]).map(lv => `<button class="chip lv" type="button" data-lv="${lv}" aria-pressed="false">
    <span class="dot" style="background:${lvColor(lv)}"></span>${lv}</button>`).join("");

/* ---------- 3·4·5단 ---------- */
const SHOWN = 5;

function chips(l) {
  const p = (l.chips || []).slice(0, 2).map(c =>
    `<span class="pat" title="${esc(c)}">${esc(c.replace(/\s*\(.*$/, "").trim() || c)}</span>`);
  if (l.refs && l.refs.length) p.push(`<span class="pat ref">핵심 ${l.refs[0]}</span>`);
  return p.join(`<span class="sep">·</span>`);
}

/** 문장을 그대로 쓰되, 배우는 조각에만 mark 를 씌운다. spans 는 빌드 때 계산된다. */
function marked(sentence, spans) {
  if (!spans || !spans.length) return esc(sentence);
  let out = "", last = 0;
  for (const [a, b] of spans) {
    out += esc(sentence.slice(last, a)) + "<mark>" + esc(sentence.slice(a, b)) + "</mark>";
    last = b;
  }
  return out + esc(sentence.slice(last));
}

function detail(l) {
  let h = "";
  if (l.scene) h += `<p class="scene"><b class="lbl">장면</b>${esc(l.scene)}</p>`;
  if (l.can) {
    const words = l.can.split(" · ").map(w => w.trim()).filter(Boolean);
    const listy = words.length >= 3 && words.every(w => w.length <= 7);
    h += `<div class="goal"><b class="lbl">${esc(l.canLabel || "할 수 있다")}</b>` + (listy
      ? `<div class="words">${words.map(w => `<span>${esc(w)}</span>`).join("")}</div>` : esc(l.can)) + `</div>`;
  }
  if (l.fix) h += `<div class="goal" style="margin-top:12px"><b class="lbl">고치는 법</b>${esc(l.fix)}</div>`;

  const ps = (l.pats || []).filter(p => p.ex || p.pat);
  if (ps.length) {
    h += `<div class="pats">` + ps.map(p => `<div class="pcard">
      ${p.ex ? `<p class="sent">${marked(p.ex, p.spans)}</p>` : ""}
      ${p.reply ? `<p class="reply">${esc(p.reply)}</p>` : ""}
      <div class="pmeta"><span class="pname">${esc(p.pat)}</span>
        ${p.gloss ? `<span class="pgloss">${esc(p.gloss)}</span>` : ""}</div></div>`).join("") + `</div>`;
  } else if (l.chips && l.chips.length) {
    h += `<div class="subhead"><span class="lbl">배우는 것</span>
      <div class="allchips">${l.chips.map(c => `<span>${esc(c)}</span>`).join("")}</div></div>`;
  }
  if (l.notes && l.notes.length) {
    h += `<div class="notes">` + l.notes.map(n => `<div><b>${esc(n.k)}</b><span>${esc(n.v)}</span></div>`).join("") + `</div>`;
  }
  return h || `<p class="scene">이 과의 상세는 목차 원문에 있습니다.</p>`;
}

function lessonRow(l, i) {
  const c = chips(l);
  const sub = l.sub || (c ? "" : l.can);
  const no = String(l.n).padStart(2, "0");
  return `<div class="lesson${i >= SHOWN ? " over" : ""}" data-text="${esc([l.title, l.sub, l.can, l.scene, (l.chips||[]).join(" "), (l.notes||[]).map(n=>n.v).join(" ")].join(" ").toLowerCase())}">
    <button class="lrow-btn" type="button">
      <span class="lno">${esc(T.lessonWord)} ${no}</span>
      <span class="ltitle">${esc(l.title)}${sub ? ` <em>— ${esc(sub)}</em>` : ""}</span>
      <span class="lchips">${c}</span>
      <span class="lcaret"></span>
    </button>
    <div class="ldetail">${detail(l)}</div>
  </div>`;
}

function group(g) {
  let head = "";
  if (g.work) {
    head += `<p class="story"><b>《${esc(g.work)}》</b> ${esc(g.story)}
      ${g.cast ? `<span class="cast">등장인물 — ${esc(g.cast)}</span>` : ""}</p>`;
  }
  if (g.blurb) {
    head += g.work || T.id === "3-contextual-korean"
      ? `<p class="gcan"><b class="lbl">끝내면 할 수 있는 것</b>${esc(g.blurb)}</p>`
      : `<p class="gblurb">${esc(g.blurb)}</p>`;
  }
  const all = [];
  for (const l of g.lessons) for (const c of (l.chips || [])) if (!all.includes(c)) all.push(c);
  const isPat = g.lessons.some(l => l.pats && l.pats.length);
  if (all.length && isPat) {
    head += `<p class="cloud"><span class="lbl">패턴 ${all.length}</span>`
      + all.map(c => `<b>${esc(c)}</b>`).join(`<span class="sep">·</span>`) + `</p>`;
  }

  const extra = Math.max(0, g.lessons.length - SHOWN);
  return `<div class="group" data-lv="${esc(g.level || "")}">
    <button class="ghead" type="button">
      <span class="gnum">${esc(g.label)}</span>
      <span class="gtitle">${esc(g.title)}${g.subtitle ? `<em>${esc(g.subtitle)}</em>` : ""}</span>
      <span class="gmeta">${g.peak ? `<span>핵심 ${g.peak}과까지</span>` : ""}${g.form ? `<span>${esc(g.form)}</span>` : ""}
        ${g.level ? `<span class="lv-tag"><i style="background:${lvColor(g.level)}"></i>${esc(g.levelText || g.level)}</span>` : ""}
        <span>${g.lessons.length}${esc(T.lessonWord)}</span><span class="caret"></span></span>
    </button>
    <div class="gbody">
      ${head}
      <div class="lessons">${g.lessons.map(lessonRow).join("")}</div>
      ${extra ? `<button class="more" type="button"><span class="m-open">더 보기 ${extra}</span><span class="m-close">접기</span></button>` : ""}
      ${g.checkpoint ? `<p class="ckpt"><b class="lbl">체크포인트</b>${esc(g.checkpoint)}</p>` : ""}
    </div>
  </div>`;
}

const $groups = document.getElementById("groups");
$groups.innerHTML = T.groups.map(group).join("");

/* ---------- 이전 · 다음 트랙 ---------- */
{
  const i = DATA.nav.findIndex(n => n.id === T.id);
  const prev = DATA.nav[i - 1], next = DATA.nav[i + 1];
  document.getElementById("nextrack").innerHTML =
    (prev ? `<a href="${esc(prev.id)}.html">← ${esc(prev.ko)}</a>` : `<a href="../catalog.html">← 카탈로그</a>`) +
    (next ? `<a href="${esc(next.id)}.html">${esc(next.ko)} →</a>` : `<a href="../catalog.html">카탈로그 →</a>`);
}

/* ---------- behaviour ---------- */
const $controls = document.querySelector(".controls");
const controlsTop = $controls.getBoundingClientRect().top + scrollY;
addEventListener("scroll", () => $controls.classList.toggle("stuck", scrollY > controlsTop - 47), { passive: true });

$groups.addEventListener("click", e => {
  const head = e.target.closest(".ghead");
  if (head) { head.parentElement.classList.toggle("open"); return; }
  const more = e.target.closest(".more");
  if (more) { more.closest(".group").classList.toggle("all"); return; }
  const row = e.target.closest(".lrow-btn");
  if (row) { row.parentElement.classList.toggle("open"); }
});

const $q = document.getElementById("q");
const $hits = document.getElementById("hits");
const $empty = document.getElementById("empty");
let activeLevels = new Set();

function apply() {
  const q = $q.value.trim().toLowerCase();
  let hits = 0, shown = 0;
  document.querySelectorAll(".group").forEach(g => {
    const lvOk = !activeLevels.size || activeLevels.has(g.dataset.lv);
    let inGroup = 0;
    g.querySelectorAll(".lesson").forEach(l => {
      const ok = lvOk && (!q || l.dataset.text.includes(q));
      l.classList.toggle("hide", !ok);
      if (ok) inGroup++;
    });
    g.classList.toggle("hide", inGroup === 0);
    if (inGroup) shown++;
    hits += inGroup;
    if (q) g.classList.add("open", "all");
    else if (!activeLevels.size) g.classList.remove("all");
  });
  const filtering = q || activeLevels.size;
  $hits.textContent = filtering ? `${hits}${T.lessonWord} · ${shown}${T.unitWord}` : "";
  $empty.classList.toggle("hide", !(filtering && hits === 0));

  if (q) {
    document.querySelectorAll(".lesson:not(.hide) .ltitle").forEach(el => {
      const t = el.textContent, i = t.toLowerCase().indexOf(q);
      if (i < 0) return;
      el.innerHTML = esc(t.slice(0, i)) + "<mark>" + esc(t.slice(i, i + q.length)) + "</mark>" + esc(t.slice(i + q.length));
    });
  }
}

$q.addEventListener("input", () => {
  document.querySelectorAll(".ltitle mark").forEach(m => { const p = m.parentElement; p.innerHTML = p.textContent; });
  apply();
});

document.getElementById("levelbar").addEventListener("click", e => {
  const b = e.target.closest(".lv");
  if (!b) return;
  const lv = b.dataset.lv;
  activeLevels.has(lv) ? activeLevels.delete(lv) : activeLevels.add(lv);
  b.setAttribute("aria-pressed", activeLevels.has(lv));
  apply();
});

const $expand = document.getElementById("expand");
$expand.addEventListener("click", () => {
  const open = $expand.dataset.on !== "1";
  $expand.dataset.on = open ? "1" : "0";
  $expand.textContent = open ? "모두 접기" : "모두 펼치기";
  document.querySelectorAll(".group").forEach(g => g.classList.toggle("open", open));
});

// 들어오자마자 첫 단원은 열어 둔다 — 이 페이지는 이미 한 트랙으로 좁혀진 자리라,
// 무엇이 들어 있는지 한 번은 보여 주는 편이 낫다.
document.querySelector(".group")?.classList.add("open");
</script>
